name: ProCam
options:
  bundleIdPrefix: com.erion
  deploymentTarget:
    iOS: "17.0"
targets:
  ProCam:
    type: application
    platform: iOS
    sources: [ProCam]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erion.procam
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ProCam
        INFOPLIST_KEY_NSCameraUsageDescription: "ProCam uses the camera to take photos."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "ProCam saves your photos to your library."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
schemes:
  ProCam:
    build:
      targets:
        ProCam: all
