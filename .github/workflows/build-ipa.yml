name: Build IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Intel Mac runners have short queues; the app is still built for iPhone (arm64).
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (26+ enables Liquid Glass)
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version | tee xcode-version.txt
          echo "XCODE_VERSION=$(head -1 xcode-version.txt)" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ProCam.xcodeproj \
            -scheme ProCam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Report compile errors as annotations
        if: failure()
        run: |
          grep -E ": error: " build.log | sed -E 's#^.*/ProCam/##' | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ProCam.app Payload/
          zip -qry ProCam.ipa Payload

      - name: Publish to Releases (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" ProCam.ipa \
            --title "ProCam build ${{ github.run_number }}" \
            --notes "Unsigned IPA from commit ${GITHUB_SHA::7}, built with ${XCODE_VERSION}. Install with Sideloadly." \
            --latest

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
